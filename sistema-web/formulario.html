<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con CSS Externo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="form-container">
    <h2>Registro de Usuario</h2>
    
    <form action="#" method="POST">
        
        <fieldset>
            <legend>Datos Personales</legend>
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre aquí" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Preferencias</legend>
            <div class="form-group">
                <label for="interes">Área de interés</label>
                <select id="interes" name="interes">
                    <option value="db">Base de Datos</option>
                    <option value="dev">Desarrollo Web</option>
                    <option value="analyst">Análisis de Datos</option>
                </select>
            </div>

            <div class="form-group">
                <label>¿Deseas recibir noticias?</label>
                <div class="radio-group">
                    <label><input type="radio" name="noticias" value="si" checked> Sí</label>
                    <label><input type="radio" name="noticias" value="no"> No</label>
                </div>
            </div>
        </fieldset>

        <div class="form-group">
            <label for="mensaje">Mensaje adicional</label>
            <textarea id="mensaje" name="mensaje" rows="3"></textarea>
        </div>

        <div class="button-group">
            <button type="submit">Enviar Registro</button>
            <button type="reset" class="btn-reset">Limpiar</button>
        </div>

    </form>
</div>

</body>
</html>
