<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Personal</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- Iconos opcionales (puedes usar FontAwesome para el icono de salida) -->
</head>
<body>

    <main class="main-container">
        <!-- Cabecera -->
        <header class="header">
            <div class="logo-placeholder">
                <img src="..\sistema-web\recursos\logo.png" alt="Logo" width="100px"> <!-- Reemplaza con tu logo real -->
            </div>
            <div class="logout-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </div>
        </header>

        <!-- Formulario -->
        <section class="form-wrapper">
            <h1 class="form-title">Registrar Personal</h1>
            
            <form class="card">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label for="email">Contacto</label>
                    <input type="number" pattern="[0-9]" id="contacto">
                </div>

                <div class="form-group">
                    <label for="cargo">Cargo</label>
                    <select id="cargo">
                        <option value="seleccione" disabled selected>Seleccione</option>
                        <option value="administrador">Administrador</option>
                        <option value="profesor">Profesor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="area">Area</label>
                    <select id="area">
                        <option value="seleccione" disabled selected>Seleccione</option>
                        <option value="sistemas">Desarrollo Personal, ciudadanía y civica</option>
                        <option value="sistemas">Ciencias Sociales</option>
                        <option value="sistemas">Educación Física</option>
                        <option value="sistemas">Arte y Cultura</option>
                        <option value="sistemas">Comunicación</option>
                        <option value="sistemas">Castellano como segunda lengua</option>
                        <option value="sistemas">Inglés</option>
                        <option value="sistemas">Matemática</option>
                        <option value="sistemas">Ciencia y Tecnología</option>
                        <option value="sistemas">Educación Religiosa</option>
                        <option value="sistemas">Educación para el trabajo</option>
                    </select>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <button type="button" class="btn btn-secondary">Cancelar</button>
                </div>
                
            </form>
        </section>
    </main>

</body>
</html>
